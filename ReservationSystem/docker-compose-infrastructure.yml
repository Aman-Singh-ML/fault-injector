version: '3.8'

services:
  # PostgreSQL for Auth Service - Isolated Database Instance
  postgres-auth:
    image: postgres:16
    container_name: hotel-postgres-auth
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
      - ./init-db-auth.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hotel-network

  # PostgreSQL for Booking Service - Isolated Database Instance
  postgres-booking:
    image: postgres:16
    container_name: hotel-postgres-booking
    environment:
      POSTGRES_USER: booking_user
      POSTGRES_PASSWORD: booking_pass
      POSTGRES_DB: booking_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_booking_data:/var/lib/postgresql/data
      - ./init-db-booking.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking_user -d booking_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hotel-network

  # PostgreSQL for Payment Service - Isolated Database Instance
  postgres-payment:
    image: postgres:16
    container_name: hotel-postgres-payment
    environment:
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_pass
      POSTGRES_DB: payment_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_payment_data:/var/lib/postgresql/data
      - ./init-db-payment.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_user -d payment_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hotel-network

  # MongoDB - Used by Search service
  mongo:
    image: mongo:6
    container_name: hotel-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hotel-network

  # Redis - Main instance (kept for backward compatibility)
  redis:
    image: redis:7-alpine
    container_name: hotel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hotel-network

  # Redis for Auth Service - Profile caching
  redis-auth:
    image: redis:7-alpine
    container_name: hotel-redis-auth
    ports:
      - "6380:6379"
    volumes:
      - redis_auth_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hotel-network

  # Redis for Search Service - Search results caching
  redis-search:
    image: redis:7-alpine
    container_name: hotel-redis-search
    ports:
      - "6381:6379"
    volumes:
      - redis_search_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hotel-network

  # Redis for Booking Service - Booking data caching
  redis-booking:
    image: redis:7-alpine
    container_name: hotel-redis-booking
    ports:
      - "6382:6379"
    volumes:
      - redis_booking_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hotel-network

  # Redis for Payment Service - Payment data caching
  redis-payment:
    image: redis:7-alpine
    container_name: hotel-redis-payment
    ports:
      - "6383:6379"
    volumes:
      - redis_payment_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hotel-network

  # Redis for Notification Service - Notification data caching
  redis-notification:
    image: redis:7-alpine
    container_name: hotel-redis-notification
    ports:
      - "6384:6379"
    volumes:
      - redis_notification_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hotel-network

  # Redis UI for Auth Service - Real-time monitoring (RedisInsight)
  redis-ui-auth:
    image: redislabs/redisinsight:latest
    container_name: hotel-redis-ui-auth
    ports:
      - "8888:8001"
    environment:
      REDIS_HOST: redis-auth
      REDIS_PORT: 6379
    depends_on:
      - redis-auth
    networks:
      - hotel-network

  # Redis Commander - General Redis UI for all instances
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: hotel-redis-commander
    ports:
      - "8889:8081"
    environment:
      - REDIS_HOSTS=auth:redis-auth:6379,search:redis-search:6379,booking:redis-booking:6379,payment:redis-payment:6379,notification:redis-notification:6379
    depends_on:
      - redis-auth
      - redis-search
      - redis-booking
      - redis-payment
      - redis-notification
    networks:
      - hotel-network

  # Kafka 8.0+ - KRaft mode (no Zookeeper required) - Main Kafka for general events
  kafka:
    image: confluentinc/cp-kafka:8.0.0
    container_name: hotel-kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9094,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkQkQjQ1NTcwNTJENDQyQjk=
    ports:
      - "9092:9092"
      - "9093:9093"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - hotel-network

  # Kafka 8.0+ - KRaft mode - Dedicated Kafka for Booking Service
  kafka-booking:
    image: confluentinc/cp-kafka:8.0.0
    container_name: hotel-kafka-booking
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-booking:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 2@kafka-booking:9095
      KAFKA_LISTENERS: PLAINTEXT://kafka-booking:9092,CONTROLLER://kafka-booking:9095,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs-booking
      CLUSTER_ID: NkQkQjQ1NTcwNTJENDQyQjk=
    ports:
      - "9095:9092"
      - "9094:9094"
    volumes:
      - kafka_booking_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - hotel-network

  # RabbitMQ - Used by Payment and Notification services
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: hotel-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hotel-network

volumes:
  postgres_auth_data:
    driver: local
  postgres_booking_data:
    driver: local
  postgres_payment_data:
    driver: local
  mongo_data:
    driver: local
  redis_data:
    driver: local
  redis_auth_data:
    driver: local
  redis_search_data:
    driver: local
  redis_booking_data:
    driver: local
  redis_payment_data:
    driver: local
  redis_notification_data:
    driver: local
  kafka_data:
    driver: local
  kafka_booking_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  hotel-network:
    driver: bridge

