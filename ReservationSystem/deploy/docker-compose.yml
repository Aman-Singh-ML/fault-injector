version: '3.8'
services:
  nginx:
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - api-gateway

  api-gateway:
    build: ../gateway
    ports:
      - "9000:9000"
    depends_on:
      - auth-service
      - booking-service
      - search-service
      - payment-service

  auth-service:
    build: ../services/auth-service
    ports:
      - "8080:8080"

  booking-service:
    build: ../services/booking-service
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - kafka
      - rabbitmq

  search-service:
    build: ../services/search-service
    ports:
      - "8081:8081"
    depends_on:
      - postgres
      - redis

  payment-service:
    build: ../services/payment-service
    ports:
      - "8082:8082"
    depends_on:
      - mongo
      - rabbitmq

  notification-service:
    build: ../services/notification-service
    ports:
      - "8083:8083"
    depends_on:
      - rabbitmq

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: hotel_db
    ports:
      - "5432:5432"

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  kafka:
    image: bitnami/kafka:3
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper

  zookeeper:
    image: bitnami/zookeeper:3
    ports:
      - "2181:2181"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"