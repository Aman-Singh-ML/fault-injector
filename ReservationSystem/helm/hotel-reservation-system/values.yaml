#============================================================================
# INFRASTRUCTURE CONFIGURATION
#============================================================================

# PostgreSQL for Auth Service
postgresAuth:
  enabled: true
  name: postgres-auth

  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 5432
    targetPort: 5432

  # Database configuration
  database:
    name: auth_db
    user: auth_user
    password: auth_pass

  # Storage configuration
  persistence:
    enabled: true
    storageClass: "managed-csi"
    size: 1Gi
    accessModes:
      - ReadWriteOnce

  # Resource limits
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  # Security context
  securityContext:
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999

