# Global configuration
global:
  # Kubernetes namespace
  namespace: hotel-reservation
  
  # Image registry and pull policy
  imageRegistry: ""
  imagePullSecrets: []
  imagePullPolicy: Always
  
  # Storage configuration
  storageClass: "managed-csi"
  
  # Security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    fsGroup: 1001
  
  # Resource limits (can be overridden per service)
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Environment configuration
environment: production # development, staging, production

# Nginx Ingress Controller Configuration
ingressController:
  enabled: true  # Set to true to install ingress controller as part of this chart
  # Configuration for the ingress-nginx subchart
  controller:
    service:
      type: LoadBalancer
      annotations: {}
    # Allow snippets for custom NGINX configuration
    allowSnippetAnnotations: true
    metrics:
      enabled: true
      serviceMonitor:
        enabled: false  # Enable if you have Prometheus operator
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "10254"
    resources:
      requests:
        cpu: 100m
        memory: 90Mi
      limits:
        cpu: 500m
        memory: 256Mi
    # Admission webhook configuration
    admissionWebhooks:
      enabled: true
      failurePolicy: Fail
      port: 8443
      certificate: "/usr/local/certificates/cert"
      key: "/usr/local/certificates/key"
      namespaceSelector: {}
      objectSelector: {}
      annotations: {}
      # Use certManager to generate webhook certs
      certManager:
        enabled: false
      # Patch the webhook configurations with the generated certificate
      patch:
        enabled: true
        image:
          registry: registry.k8s.io
          image: ingress-nginx/kube-webhook-certgen
          tag: v20231011-8b53cabe0
          digest: sha256:a7943503b45d552785aa3b5e457f169a5661fb94d82b8a3373bcd9ebaf9aac80
          pullPolicy: IfNotPresent
        priorityClassName: ""
        podAnnotations: {}
        nodeSelector:
          kubernetes.io/os: linux
        tolerations: []
        labels: {}
        securityContext:
          runAsNonRoot: true
          runAsUser: 2000
          fsGroup: 2000
    # Ingress class configuration
    ingressClassResource:
      name: nginx
      enabled: true
      default: false
      controllerValue: "k8s.io/ingress-nginx"
    # Watch ingress without ingress class annotation
    watchIngressWithoutClass: true
    # Process ingress class nginx
    ingressClass: nginx
    # Enable validation of ingress resources
    enableAnnotationValidations: true
    # Watch all namespaces
    scope:
      enabled: false  # false means watch all namespaces
    # Election ID for leader election
    electionID: ingress-controller-leader-nginx
    # Controller class
    controllerClass: k8s.io/ingress-nginx
    # Enable debug logging
    logLevel: 2
    # Additional args for debugging
    extraArgs:
      v: 2
      logtostderr: true

# Custom Nginx Service Configuration (deprecated - using ingress controller instead)
nginx:
  enabled: false  # Disabled in favor of ingress controller

networkPolicy:
  enabled: false

# Ingress configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  # Main application paths
  paths:
    api:
      path: /api
      pathType: Prefix
      service: gateway
      port: 9000
    frontend:
      path: /
      pathType: Prefix
      service: frontend
      port: 3000
  tls: []

# Observability Stack Configuration
observability:
  enabled: true

  jaeger:
    enabled: true
    strategy: allInOne  # Use 'production' for production deployments
    storage: memory     # Use 'elasticsearch' for production
    service:
      type: ClusterIP

  prometheus:
    enabled: false
    replicas: 1
    retention: 7d
    storage: 20Gi
    persistence:
      enabled: true
    service:
      type: ClusterIP
    resources:
      requests:
        memory: 1Gi
        cpu: 200m
      limits:
        memory: 2Gi
        cpu: 500m

  alertmanager:
    enabled: false
    service:
      type: ClusterIP
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 256Mi
        cpu: 100m
    # Slack integration (optional)
    slack:
      enabled: false
      webhookUrl: ""  # Set your Slack webhook URL
      channel: "#alerts"
      criticalChannel: "#critical-alerts"
    # Email integration (optional)
    email:
      enabled: false
      to: "alerts@example.com"
      from: "alertmanager@example.com"
      smarthost: "smtp.example.com:587"
      username: ""
      password: ""
    # PagerDuty integration (optional)
    pagerduty:
      enabled: false
      serviceKey: ""

  loki:
    enabled: false
    retention: 168h  # 7 days
    storage: 10Gi
    service:
      type: ClusterIP

  grafana:
    enabled: false
    adminUser: admin
    adminPassword: admin123
    service:
      type: ClusterIP
    persistence:
      enabled: true
      size: 5Gi
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 200m

  promtail:
    enabled: false
    resources:
      requests:
        memory: 128Mi
        cpu: 100m
      limits:
        memory: 256Mi
        cpu: 200m

# Service Monitor for Prometheus
serviceMonitor:
  enabled: false
  namespace: monitoring
  interval: 30s
  scrapeTimeout: 10s

# Horizontal Pod Autoscaler
hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

#============================================================================
# MICROSERVICES CONFIGURATION
#============================================================================

# Frontend Service (Next.js)
frontend:
  enabled: true
  name: frontend
  replicaCount: 1

  image:
    repository: amansingh2708/frontend
    tag: latest
    pullPolicy: Always

  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
    annotations: {}

  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  # Environment variables
  env:
    NODE_ENV: production
    PORT: "3000"

  # Health checks - Temporarily disabled for debugging
  # livenessProbe:
  #   httpGet:
  #     path: /
  #     port: 3000
  #   initialDelaySeconds: 60
  #   periodSeconds: 30
  #   timeoutSeconds: 10
  #   failureThreshold: 5

  # readinessProbe:
  #   httpGet:
  #     path: /
  #     port: 3000
  #   initialDelaySeconds: 30
  #   periodSeconds: 10
  #   timeoutSeconds: 5
  #   failureThreshold: 3

# API Gateway Service
gateway:
  enabled: true
  name: gateway
  replicaCount: 1
  
  image:
    repository: amansingh2708/gateway
    tag: latest
    pullPolicy: Always
  
  service:
    type: ClusterIP
    port: 9000
    targetPort: 9000
    annotations: {}
  
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  
  # Environment variables
  env:
    NODE_ENV: production
    PORT: "9000"
    RATE_LIMIT_WINDOW_MS: "900000"
    RATE_LIMIT_MAX_REQUESTS: "100"
  
  # Health checks
  livenessProbe:
    httpGet:
      path: /health
      port: 9000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  
  readinessProbe:
    httpGet:
      path: /health
      port: 9000
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Auth Service (Java/Spring Boot)
authService:
  enabled: true
  name: auth-service
  replicaCount: 1
  
  image:
    repository: amansingh2708/auth-service
    tag: latest
    pullPolicy: Always
  
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
    annotations: {}
  
  resources:
    requests:
      memory: "512Mi"
      cpu: "300m"
    limits:
      memory: "1Gi"
      cpu: "800m"
  
  # Environment variables
  env:
    SPRING_PROFILES_ACTIVE: kubernetes
    JWT_SECRET: "mySecretKeyForJWTTokenGenerationAndValidation123456789"
    JWT_EXPIRATION: "86400000"
    SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
    SPRING_JPA_SHOW_SQL: "false"
  
  # Health checks
  livenessProbe:
    httpGet:
      path: /actuator/health
      port: 8080
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  
  readinessProbe:
    httpGet:
      path: /actuator/health
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

