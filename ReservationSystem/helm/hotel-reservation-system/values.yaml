    timeoutSeconds: 5
    failureThreshold: 3
  
  readinessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Payment Service (Go)
paymentService:
  enabled: true
  name: payment-service
  replicaCount: 1
  
  image:
    repository: amansingh2708/payment-service
    tag: latest
    pullPolicy: Always
  
  service:
    type: ClusterIP
    port: 8082
    targetPort: 8082
    annotations: {}
  
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  
  # Environment variables
  env:
    GIN_MODE: release
    PORT: "8082"
  
  # Health checks
  livenessProbe:
    httpGet:
      path: /health
      port: 8082
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  
  readinessProbe:
    httpGet:
      path: /health
      port: 8082
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Notification Service (Python/FastAPI)
notificationService:
  enabled: true
  name: notification-service
  replicaCount: 1
  
  image:
    repository: amansingh2708/notification-service
    tag: latest
    pullPolicy: Always
  
  service:
    type: ClusterIP
    port: 8083
    targetPort: 8083
