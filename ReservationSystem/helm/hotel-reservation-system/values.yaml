# Global configuration
global:
  # Kubernetes namespace
  namespace: hotel-reservation
  
  # Image registry and pull policy
  imageRegistry: ""
  imagePullSecrets: []
  imagePullPolicy: Always
  
  # Storage configuration
  storageClass: "managed-csi"
  
  # Security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    fsGroup: 1001
  
  # Resource limits (can be overridden per service)
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Environment configuration
environment: development # development, staging, production

# Ingress configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: hotel-reservation.local
      paths:
        - path: /api
          pathType: Prefix
          service: gateway
          port: 9000
        - path: /
          pathType: Prefix
          service: frontend
          port: 3000
  tls: []

# Service Monitor for Prometheus
serviceMonitor:
  enabled: false
  namespace: monitoring
  interval: 30s
  scrapeTimeout: 10s

# Horizontal Pod Autoscaler
hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Network Policies
networkPolicy:
  enabled: false
  ingress: []
  egress: []

#============================================================================
# MICROSERVICES CONFIGURATION
#============================================================================

# Frontend Service (Next.js)
frontend:
  enabled: true
  name: frontend
  replicaCount: 1

  image:
    repository: amansingh2708/frontend
    tag: latest
    pullPolicy: Always

  service:
    type: NodePort
    port: 3000
    targetPort: 3000
    nodePort: 30300
    annotations: {}

  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  # Environment variables
  env:
    NODE_ENV: production
    PORT: "3000"

  # Health checks
  livenessProbe:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# API Gateway Service
gateway:
  enabled: true
  name: gateway
  replicaCount: 1
  
  image:
    repository: amansingh2708/gateway
    tag: latest
    pullPolicy: Always
  
  service:
    type: ClusterIP
    port: 9000
    targetPort: 9000
    annotations: {}
  
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  
  # Environment variables
  env:
    NODE_ENV: production
    PORT: "9000"
    RATE_LIMIT_WINDOW_MS: "900000"
    RATE_LIMIT_MAX_REQUESTS: "100"
  
  # Health checks
  livenessProbe:
    httpGet:
      path: /health
      port: 9000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  
  readinessProbe:
    httpGet:
      path: /health
      port: 9000
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Auth Service (Java/Spring Boot)
authService:
  enabled: true
  name: auth-service
  replicaCount: 1
  
  image:
    repository: amansingh2708/auth-service
    tag: latest
    pullPolicy: Always
  
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
    annotations: {}
  
  resources:
    requests:
      memory: "512Mi"
      cpu: "300m"
    limits:
      memory: "1Gi"
      cpu: "800m"
  
  # Environment variables
  env:
    SPRING_PROFILES_ACTIVE: kubernetes
    JWT_SECRET: "mySecretKeyForJWTTokenGenerationAndValidation123456789"
    JWT_EXPIRATION: "86400000"
    SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
    SPRING_JPA_SHOW_SQL: "false"
  
  # Health checks
  livenessProbe:
    httpGet:
      path: /actuator/health
      port: 8080
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  
  readinessProbe:
    httpGet:
      path: /actuator/health
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Search Service (Go)
searchService:
  enabled: true
  name: search-service
  replicaCount: 1
  
  image:
    repository: amansingh2708/search-service
    tag: latest
    pullPolicy: Always
  
  service:
    type: ClusterIP
    port: 8081
    targetPort: 8081
    annotations: {}
  
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  
  # Environment variables
  env:
    GIN_MODE: release
    PORT: "8081"
  
  # Health checks
  livenessProbe:
    httpGet:
      path: /health
      port: 8081
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  
  readinessProbe:
    httpGet:
      path: /health
      port: 8081
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Booking Service (Python/FastAPI)
bookingService:
  enabled: true
  name: booking-service
  replicaCount: 1
  
  image:
    repository: amansingh2708/booking-service
    tag: latest
    pullPolicy: Always
  
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
    annotations: {}
  
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  
  # Environment variables
  env:
    PYTHONPATH: "/app"
    PORT: "8000"
  
  # Health checks
  livenessProbe:
    httpGet:
      path: /health
