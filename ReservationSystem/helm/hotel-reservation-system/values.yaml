# Redis Cache
redis:
  enabled: true
  name: redis

  image:
    repository: redis
    tag: "7.2-alpine"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 6379
    targetPort: 6379

  # Storage configuration
  persistence:
    enabled: true
    storageClass: "standard"
    size: 1Gi
    accessModes:
      - ReadWriteOnce

  # Resource limits
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

  # Redis configuration
  config:
    maxmemory: "200mb"
    maxmemory-policy: "allkeys-lru"
    save: "900 1 300 10 60 10000"


# RabbitMQ Message Broker
rabbitmq:
  enabled: true
  name: rabbitmq

  image:
    repository: rabbitmq
    tag: "3.12-management-alpine"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    amqpPort: 5672
    managementPort: 15672

  # Storage configuration
  persistence:
    enabled: true
    storageClass: "standard"
    size: 1Gi
    accessModes:
      - ReadWriteOnce

  # Resource limits
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  # RabbitMQ configuration
  config:
    RABBITMQ_DEFAULT_USER: "admin"
    RABBITMQ_DEFAULT_PASS: "admin123"
    RABBITMQ_DEFAULT_VHOST: "/"

kafka:
  enabled: false

  # Use a recent, non-legacy Bitnami image for better support
  image:
    registry: docker.io
    repository: bitnamilegacy/kafka
    tag: "3.8.0-debian-12-r5"

  # KRaft mode configuration
  controller:
    replicaCount: 3
    persistence:
      enabled: true
      storageClass: "managed-csi"
      size: 1Gi
    resources:
      limits:
        memory: "1Gi"
        cpu: "800m"
      requests:
        memory: "512Mi"
        cpu: "300m"

  broker:
    replicaCount: 0 # Controllers will also be brokers

  # Disable Zookeeper completely
  zookeeper:
    enabled: false

  # Enable KRaft mode
  kraft:
    enabled: true
    # Specify the process roles for the controller nodes
    processRoles: "controller,broker"
  # Listeners configuration
  listeners:
    # Internal listener for inter-broker and internal-client communication
    client:
      containerPort: 9092
      protocol: PLAINTEXT
      name: CLIENT

    # External listener for outside clients
    external:
      containerPort: 9092 # Note: uses the same container port, but accessed via LoadBalancer port
      protocol: PLAINTEXT
      name: EXTERNAL

  # Additional environment variables for Kafka config
  extraEnvVars:
    - name: KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR
      value: "1"
    - name: KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
      value: "1"
    - name: KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR
      value: "1"
    - name: KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE
      value: "true"
    - name: KAFKA_CFG_LOG_RETENTION_HOURS
      value: "168"
    - name: KAFKA_CFG_NUM_PARTITIONS
      value: "3"
    - name: KAFKA_CFG_DEFAULT_REPLICATION_FACTOR
      value: "1"
    
  # Enable dynamic updates to advertised.listeners based on the service's IP
  # This is crucial for external connectivity in cloud environments
  extraEnvVars:
    - name: KAFKA_CFG_ADVERTISED_LISTENERS
      value: "EXTERNAL://$(KAFKA_EXTERNAL_SERVICE_HOST):$(KAFKA_EXTERNAL_SERVICE_PORT),CLIENT://:9092"
    - name: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP
      value: "CLIENT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
    - name: KAFKA_CFG_LISTENERS
      value: "CLIENT://:9092,EXTERNAL://:9092,CONTROLLER://:9093"
    - name: KAFKA_CFG_INTER_BROKER_LISTENER_NAME
      value: "CLIENT"
    - name: KAFKA_CFG_CONTROLLER_LISTENER_NAMES
      value: "CONTROLLER"
