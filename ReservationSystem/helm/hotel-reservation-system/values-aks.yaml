# Hotel Reservation System - AKS Optimized Configuration

# Global configuration
global:
  namespace: hotel-reservation
  environment: production
  imageRegistry: ""
  imagePullPolicy: Always

# Nginx configuration optimized for AKS
nginx:
  enabled: true
  name: nginx
  replicaCount: 2  # Multiple replicas for HA

  image:
    repository: nginx
    tag: "1.25-alpine"
    pullPolicy: IfNotPresent

  service:
    type: LoadBalancer
    port: 80
    targetPort: 8080
    annotations:
      # Azure Load Balancer specific annotations
      service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: "/health"
      service.beta.kubernetes.io/azure-load-balancer-health-probe-interval: "5"
      service.beta.kubernetes.io/azure-load-balancer-health-probe-num-of-probe: "2"
      # Optional: Use Standard SKU load balancer
      # service.beta.kubernetes.io/azure-load-balancer-sku: "Standard"

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

  # Health checks
  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  config:
    workerProcesses: "auto"
    workerConnections: 2048
    keepaliveTimeout: 65
    clientMaxBodySize: "50m"
    clientBodyTimeout: "60s"
    clientHeaderTimeout: "60s"
    proxyConnectTimeout: "60s"
    proxyReadTimeout: "300s"
    proxySendTimeout: "60s"
    proxyBufferSize: "8k"
    proxyBuffers: "16 8k"
    rateLimitZone: "$binary_remote_addr zone=api:10m rate=20r/s"
    rateLimitBurst: 50
    
    securityHeaders:
      enabled: true
      frameOptions: "DENY"
      contentTypeOptions: "nosniff"
      xssProtection: "1; mode=block"
      referrerPolicy: "strict-origin-when-cross-origin"
      contentSecurityPolicy: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' ws: wss:;"
    
    gzip:
      enabled: true
      level: 6
      minLength: 1000
      types: "text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/x-javascript text/js"

# Frontend configuration
frontend:
  enabled: true
  name: frontend
  replicaCount: 1
  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Gateway configuration
gateway:
  enabled: true
  name: gateway
  replicaCount: 1
  service:
    type: ClusterIP
    port: 9000
    targetPort: 9000
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Enhanced ingress configuration for AKS
ingress:
  enabled: false  # We're using LoadBalancer instead
  className: "nginx"

# Service configurations - all ClusterIP for internal communication
authService:
