{{- if .Values.ingress.enabled }}
---
# API Gateway Ingress - with path rewrite to strip /api prefix
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "hotel-reservation.fullname" . }}-api-ingress
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hotel-reservation.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
  - http:
      paths:
      # Strip /api prefix: /api/auth/register -> /auth/register
      - path: /api(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: {{ .Values.ingress.paths.api.service }}
            port:
              number: {{ .Values.ingress.paths.api.port }}
---
# Frontend Ingress - serves at root
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "hotel-reservation.fullname" . }}-frontend-ingress
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hotel-reservation.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
  - http:
      paths:
      # Frontend at root - catches everything else
      - path: {{ .Values.ingress.paths.frontend.path }}
        pathType: {{ .Values.ingress.paths.frontend.pathType }}
        backend:
          service:
            name: {{ .Values.ingress.paths.frontend.service }}
            port:
              number: {{ .Values.ingress.paths.frontend.port }}

