{{- if .Values.networkPolicy.enabled }}
---
# Default deny all ingress traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hotel-reservation.fullname" . }}-default-deny
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hotel-reservation.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
# Allow ingress to Gateway from external
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hotel-reservation.fullname" . }}-gateway-ingress
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hotel-reservation.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.gateway.name }}
  policyTypes:
  - Ingress
  ingress:
  - from: []
    ports:
    - protocol: TCP
      port: {{ .Values.gateway.service.targetPort }}
---
# Allow Gateway to communicate with all services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hotel-reservation.fullname" . }}-gateway-egress
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hotel-reservation.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.gateway.name }}
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: {{ .Values.authService.name }}
    ports:
    - protocol: TCP
      port: {{ .Values.authService.service.targetPort }}
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: {{ .Values.searchService.name }}
    ports:
    - protocol: TCP
      port: {{ .Values.searchService.service.targetPort }}
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: {{ .Values.bookingService.name }}
    ports:
    - protocol: TCP
      port: {{ .Values.bookingService.service.targetPort }}
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: {{ .Values.paymentService.name }}
    ports:
    - protocol: TCP
      port: {{ .Values.paymentService.service.targetPort }}
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: {{ .Values.notificationService.name }}
    ports:
    - protocol: TCP
      port: {{ .Values.notificationService.service.targetPort }}
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
---
# Allow services to communicate with their databases
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hotel-reservation.fullname" . }}-database-access
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hotel-reservation.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: hotel-reservation-system
  policyTypes:
  - Egress
  egress:
  # PostgreSQL access
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: {{ .Values.postgresAuth.name }}
    ports:
    - protocol: TCP
      port: {{ .Values.postgresAuth.service.targetPort }}
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: {{ .Values.postgresBooking.name }}
    ports:
    - protocol: TCP
      port: {{ .Values.postgresBooking.service.targetPort }}
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: {{ .Values.postgresPayment.name }}
    ports:
    - protocol: TCP
      port: {{ .Values.postgresPayment.service.targetPort }}
  # MongoDB access
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: {{ .Values.mongodb.name }}
    ports:
    - protocol: TCP
      port: {{ .Values.mongodb.service.targetPort }}
  # Redis access
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: {{ .Values.redis.name }}
    ports:
    - protocol: TCP
      port: {{ .Values.redis.service.targetPort }}
  # Kafka access
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: {{ .Values.kafka.name }}
    ports:
    - protocol: TCP
      port: {{ .Values.kafka.service.targetPort }}
  # RabbitMQ access
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: {{ .Values.rabbitmq.name }}
    ports:
    - protocol: TCP
      port: {{ .Values.rabbitmq.service.amqpPort }}
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
---
# Allow ingress to databases only from application services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hotel-reservation.fullname" . }}-database-ingress
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hotel-reservation.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: database
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: hotel-reservation-system
{{- end }}
