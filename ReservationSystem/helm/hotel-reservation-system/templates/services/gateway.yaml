{{- if .Values.gateway.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.gateway.name }}-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hotel-reservation.serviceLabels" (dict "serviceName" .Values.gateway.name "context" .) | nindent 4 }}
data:
  # Service URLs
  AUTH_SERVICE_URL: "http://{{ .Values.authService.name }}:{{ .Values.authService.service.port }}"
  SEARCH_SERVICE_URL: "http://{{ .Values.searchService.name }}:{{ .Values.searchService.service.port }}"
  BOOKING_SERVICE_URL: "http://{{ .Values.bookingService.name }}:{{ .Values.bookingService.service.port }}"
  PAYMENT_SERVICE_URL: "http://{{ .Values.paymentService.name }}:{{ .Values.paymentService.service.port }}"
  NOTIFICATION_SERVICE_URL: "http://{{ .Values.notificationService.name }}:{{ .Values.notificationService.service.port }}"
  
  # Gateway configuration
  {{- range $key, $value := .Values.gateway.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  
  # Database connection for gateway (if needed)
  DB_HOST: "{{ .Values.postgresAuth.name }}"
  DB_PORT: {{ .Values.postgresAuth.service.port | quote }}
  DB_USER: {{ .Values.postgresAuth.database.user | quote }}
  DB_PASSWORD: {{ .Values.postgresAuth.database.password | quote }}
  DB_NAME: {{ .Values.postgresAuth.database.name | quote }}
  
  # JWT configuration
  JWT_SECRET: {{ .Values.authService.env.JWT_SECRET | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hotel-reservation.serviceLabels" (dict "serviceName" .Values.gateway.name "context" .) | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "hotel-reservation.serviceSelectorLabels" (dict "serviceName" .Values.gateway.name "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hotel-reservation.serviceSelectorLabels" (dict "serviceName" .Values.gateway.name "context" .) | nindent 8 }}
      annotations:
        checksum/config: {{ include "hotel-reservation.envVars" (dict "serviceName" .Values.gateway.name "context" .) | sha256sum }}
    spec:
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- include "hotel-reservation.securityContext" .Values.global.securityContext | nindent 6 }}
      containers:
      - name: {{ .Values.gateway.name }}
        image: {{ include "hotel-reservation.image" (dict "registry" .Values.global.imageRegistry "repository" .Values.gateway.image.repository "tag" .Values.gateway.image.tag) }}
        imagePullPolicy: {{ .Values.gateway.image.pullPolicy | default .Values.global.imagePullPolicy }}
        ports:
        - containerPort: {{ .Values.gateway.service.targetPort }}
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: {{ .Values.gateway.name }}-config
        {{- include "hotel-reservation.resources" .Values.gateway.resources | nindent 8 }}
        {{- if .Values.gateway.livenessProbe }}
        livenessProbe:
          {{- toYaml .Values.gateway.livenessProbe | nindent 10 }}
        {{- end }}
        {{- if .Values.gateway.readinessProbe }}
        readinessProbe:
          {{- toYaml .Values.gateway.readinessProbe | nindent 10 }}
        {{- end }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hotel-reservation.serviceLabels" (dict "serviceName" .Values.gateway.name "context" .) | nindent 4 }}
  {{- if .Values.gateway.service.annotations }}
  annotations:
    {{- toYaml .Values.gateway.service.annotations | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
  - port: {{ .Values.gateway.service.port }}
    targetPort: {{ .Values.gateway.service.targetPort }}
    protocol: TCP
    name: http
    {{- if and (eq .Values.gateway.service.type "NodePort") .Values.gateway.service.nodePort }}
    nodePort: {{ .Values.gateway.service.nodePort }}
    {{- end }}
  selector:
    {{- include "hotel-reservation.serviceSelectorLabels" (dict "serviceName" .Values.gateway.name "context" .) | nindent 4 }}
{{- end }}
