apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-commander
  namespace: {{ .Release.Namespace }}
  labels:
    app: redis-commander
    component: infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-commander
  template:
    metadata:
      labels:
        app: redis-commander
    spec:
      containers:
      - name: redis-commander
        image: rediscommander/redis-commander:latest
        ports:
        - containerPort: 8081
          name: http
        env:
        - name: REDIS_HOSTS
          value: "minikube:{{ .Values.redis.name }}:{{ .Values.redis.service.port }}"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: redis-commander
  namespace: {{ .Release.Namespace }}
  labels:
    app: redis-commander
    component: infrastructure
spec:
  type: NodePort
  ports:
  - port: 8081
    targetPort: 8081
    nodePort: 30081
    protocol: TCP
    name: http
  selector:
    app: redis-commander

