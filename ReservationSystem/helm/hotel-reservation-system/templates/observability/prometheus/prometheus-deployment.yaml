{{- if .Values.observability.prometheus.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hotel-reservation.labels" . | nindent 4 }}
    app.kubernetes.io/name: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s

    {{- if .Values.observability.alertmanager.enabled }}
    alerting:
      alertmanagers:
      - static_configs:
        - targets:
          - alertmanager:9093
    {{- end }}

    rule_files:
    - '/etc/prometheus/rules/*.yml'

    scrape_configs:
    # Application services
    - job_name: 'gateway'
      static_configs:
      - targets: ['gateway.hotel-reservation:9000']
      metrics_path: '/metrics'

    - job_name: 'auth-service'
      static_configs:
      - targets: ['auth-service.hotel-reservation:8080']
      metrics_path: '/actuator/prometheus'

    - job_name: 'search-service'
      static_configs:
      - targets: ['search-service.hotel-reservation:8081']
      metrics_path: '/metrics'

    - job_name: 'booking-service'
      static_configs:
      - targets: ['booking-service.hotel-reservation:8000']
      metrics_path: '/metrics'

    - job_name: 'payment-service'
      static_configs:
      - targets: ['payment-service.hotel-reservation:8082']
      metrics_path: '/metrics'

    - job_name: 'notification-service'
      static_configs:
      - targets: ['notification-service.hotel-reservation:8083']
      metrics_path: '/metrics'
    
    # Infrastructure services
    - job_name: 'postgres-auth'
      static_configs:
      - targets: ['postgres-auth.hotel-reservation:9187']
    
    - job_name: 'postgres-booking'
      static_configs:
      - targets: ['postgres-booking.hotel-reservation:9187']
    
    - job_name: 'postgres-payment'
      static_configs:
      - targets: ['postgres-payment.hotel-reservation:9187']
    
    - job_name: 'mongodb'
      static_configs:
      - targets: ['mongodb.hotel-reservation:9216']
    
    - job_name: 'redis'
      static_configs:
      - targets: ['redis.hotel-reservation:9121']

    {{- if .Values.ingressController.enabled }}
    # Nginx Ingress Controller built-in metrics (port 10254)
    # Available metrics:
    # - nginx_ingress_controller_nginx_process_connections (active connections)
    # - nginx_ingress_controller_nginx_process_requests_total (total requests)
    # - nginx_ingress_controller_nginx_process_cpu_seconds_total (CPU usage)
    # - nginx_ingress_controller_nginx_process_resident_memory_bytes (memory)
    - job_name: 'nginx-ingress-controller'
      static_configs:
      - targets: ['nginx-metrics.{{ .Values.global.namespace }}.svc.cluster.local:10254']
        labels:
          service: 'nginx-ingress-controller'

    # Nginx Log Exporter - sidecar in ingress controller (port 4040)
    # Provides additional log-based metrics
    - job_name: 'nginx-log-exporter'
      static_configs:
      - targets: ['nginx-metrics.{{ .Values.global.namespace }}.svc.cluster.local:4040']
        labels:
          service: 'nginx-ingress'
          exporter: 'nginx-log-exporter'
    {{- end }}

    {{- if .Values.observability.kubeStateMetrics.enabled }}
    # kube-state-metrics - Kubernetes object metrics
    # Provides metrics like:
    # - kube_pod_container_resource_limits
    # - kube_pod_container_resource_requests
    # - kube_pod_container_status_restarts_total
    # - kube_deployment_status_replicas
    # - kube_node_status_condition
    - job_name: 'kube-state-metrics'
      static_configs:
      - targets: ['kube-state-metrics.{{ .Values.global.namespace }}.svc.cluster.local:8080']
        labels:
          service: 'kube-state-metrics'
    {{- end }}

    {{- if .Values.observability.nodeExporter.enabled }}
    # node-exporter - Node-level metrics
    # Provides metrics like:
    # - node_cpu_seconds_total
    # - node_memory_MemTotal_bytes
    # - node_memory_MemAvailable_bytes
    # - node_filesystem_size_bytes
    # - node_network_receive_bytes_total
    - job_name: 'node-exporter'
      kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
          - {{ .Values.global.namespace }}
      relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: node-exporter
      - source_labels: [__meta_kubernetes_endpoint_node_name]
        action: replace
        target_label: instance
    {{- end }}

    # cAdvisor (kubelet) - Container metrics
    # Provides metrics like:
    # - container_memory_working_set_bytes
    # - container_cpu_usage_seconds_total
    # - container_network_receive_bytes_total
    # - container_network_transmit_bytes_total
    # - container_fs_usage_bytes
    - job_name: 'kubernetes-cadvisor'
      kubernetes_sd_configs:
      - role: node
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        insecure_skip_verify: true
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
      - source_labels: [__meta_kubernetes_node_name]
        action: replace
        target_label: instance

    # Kubernetes API server
    - job_name: 'kubernetes-apiservers'
      kubernetes_sd_configs:
      - role: endpoints
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabel_configs:
      - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        action: keep
        regex: default;kubernetes;https
    
    # Kubernetes nodes
    - job_name: 'kubernetes-nodes'
      kubernetes_sd_configs:
      - role: node
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics
    
    # Kubernetes pods
    - job_name: 'kubernetes-pods'
      kubernetes_sd_configs:
      - role: pod
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hotel-reservation.labels" . | nindent 4 }}
    app.kubernetes.io/name: prometheus
spec:
  replicas: {{ .Values.observability.prometheus.replicas | default 1 }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      {{- if .Values.observability.prometheus.persistence.enabled }}
      initContainers:
      - name: init-prometheus
        image: busybox:1.35
        command: ['sh', '-c', 'mkdir -p /prometheus && chown -R 65534:65534 /prometheus']
        volumeMounts:
        - name: prometheus-storage
          mountPath: /prometheus
        securityContext:
          runAsUser: 0
      {{- end }}
      containers:
      - name: prometheus
        image: prom/prometheus:v2.47.0
        args:
        - '--config.file=/etc/prometheus/prometheus.yml'
        - '--storage.tsdb.path=/prometheus/'
        - '--web.console.libraries=/etc/prometheus/console_libraries'
        - '--web.console.templates=/etc/prometheus/consoles'
        - '--storage.tsdb.retention.time={{ .Values.observability.prometheus.retention | default "15d" }}'
        - '--web.enable-lifecycle'
        ports:
        - containerPort: 9090
          name: web
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus
        - name: prometheus-alert-rules
          mountPath: /etc/prometheus/rules
        - name: prometheus-storage
          mountPath: /prometheus
        resources:
          {{- toYaml (.Values.observability.prometheus.resources | default (dict "requests" (dict "memory" "512Mi" "cpu" "200m") "limits" (dict "memory" "1Gi" "cpu" "500m"))) | nindent 10 }}
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config
      - name: prometheus-alert-rules
        configMap:
          name: prometheus-alert-rules
      - name: prometheus-storage
        {{- if .Values.observability.prometheus.persistence.enabled }}
        persistentVolumeClaim:
          claimName: prometheus-storage
        {{- else }}
        emptyDir: {}
        {{- end }}
{{- if .Values.observability.prometheus.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-storage
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hotel-reservation.labels" . | nindent 4 }}
    app.kubernetes.io/name: prometheus
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.observability.prometheus.storage | default "10Gi" }}
  {{- if .Values.global.storageClass }}
  storageClassName: {{ .Values.global.storageClass }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hotel-reservation.labels" . | nindent 4 }}
    app.kubernetes.io/name: prometheus
spec:
  type: {{ .Values.observability.prometheus.service.type | default "ClusterIP" }}
  {{- if and (eq (.Values.observability.prometheus.service.type | default "ClusterIP") "NodePort") .Values.observability.prometheus.service.nodePort }}
  ports:
  - port: 9090
    targetPort: 9090
    nodePort: {{ .Values.observability.prometheus.service.nodePort }}
    name: web
  {{- else if eq (.Values.observability.prometheus.service.type | default "ClusterIP") "LoadBalancer" }}
  ports:
  - port: 9090
    targetPort: 9090
    name: web
  {{- else }}
  ports:
  - port: 9090
    targetPort: 9090
    name: web
  {{- end }}
  selector:
    app.kubernetes.io/name: prometheus
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hotel-reservation.labels" . | nindent 4 }}
    app.kubernetes.io/name: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-hotel-reservation
  labels:
    {{- include "hotel-reservation.labels" . | nindent 4 }}
    app.kubernetes.io/name: prometheus
rules:
- apiGroups: [""]
  resources:
  - nodes
  - nodes/proxy
  - services
  - endpoints
  - pods
  verbs: ["get", "list", "watch"]
- apiGroups:
  - extensions
  resources:
  - ingresses
  verbs: ["get", "list", "watch"]
- nonResourceURLs: ["/metrics"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-hotel-reservation
  labels:
    {{- include "hotel-reservation.labels" . | nindent 4 }}
    app.kubernetes.io/name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-hotel-reservation
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: {{ .Values.global.namespace }}
{{- end }}
