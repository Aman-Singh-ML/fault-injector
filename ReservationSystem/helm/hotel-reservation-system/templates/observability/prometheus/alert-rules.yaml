{{- if .Values.observability.prometheus.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alert-rules
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hotel-reservation.labels" . | nindent 4 }}
    app.kubernetes.io/name: prometheus-alert-rules
data:
  alert-rules.yml: |
    groups:
    - name: service_health
      interval: 30s
      rules:
      # Service Down Alerts
      - alert: ServiceDown
        expr: up{job=~"gateway|auth-service|search-service|booking-service|payment-service|notification-service"} == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Service {{ `{{` }} $labels.job {{ `}}` }} is down"
          description: "Service {{ `{{` }} $labels.job {{ `}}` }} has been down for more than 1 minute. Instance: {{ `{{` }} $labels.instance {{ `}}` }}"
          
      - alert: GatewayDown
        expr: up{job="gateway"} == 0
        for: 30s
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "API Gateway is down"
          description: "API Gateway is unreachable. All API traffic is affected."
          
      - alert: AuthServiceDown
        expr: up{job="auth-service"} == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Auth Service is down"
          description: "Authentication service is unavailable. Users cannot login or register."
          
      - alert: BookingServiceDown
        expr: up{job="booking-service"} == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Booking Service is down"
          description: "Booking service is unavailable. Users cannot make or manage bookings."
          
      - alert: PaymentServiceDown
        expr: up{job="payment-service"} == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Payment Service is down"
          description: "Payment service is unavailable. Payment processing is blocked."
          
      - alert: SearchServiceDown
        expr: up{job="search-service"} == 0
        for: 1m
        labels:
          severity: high
          category: availability
        annotations:
          summary: "Search Service is down"
          description: "Search service is unavailable. Users cannot search for hotels."
          
      - alert: NotificationServiceDown
        expr: up{job="notification-service"} == 0
        for: 2m
        labels:
          severity: warning
          category: availability
        annotations:
          summary: "Notification Service is down"
          description: "Notification service is unavailable. Users may not receive notifications."

    - name: service_errors
      interval: 30s
      rules:
      # High Error Rate Alerts
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{status=~"5.."}[5m])) by (job)
            /
            sum(rate(http_requests_total[5m])) by (job)
          ) > 0.05
        for: 5m
        labels:
          severity: high
          category: errors
        annotations:
          summary: "High error rate on {{ `{{` }} $labels.job {{ `}}` }}"
          description: "Service {{ `{{` }} $labels.job {{ `}}` }} has error rate above 5% (current: {{ `{{` }} $value | humanizePercentage {{ `}}` }})"

      - alert: CriticalErrorRate
        expr: |
          (
            sum(rate(http_requests_total{status=~"5.."}[5m])) by (job)
            /
            sum(rate(http_requests_total[5m])) by (job)
          ) > 0.10
        for: 2m
        labels:
          severity: critical
          category: errors
        annotations:
          summary: "Critical error rate on {{ `{{` }} $labels.job {{ `}}` }}"
          description: "Service {{ `{{` }} $labels.job {{ `}}` }} has error rate above 10% (current: {{ `{{` }} $value | humanizePercentage {{ `}}` }})"

      - alert: HighClientErrorRate
        expr: |
          (
            sum(rate(http_requests_total{status=~"4.."}[5m])) by (job)
            /
            sum(rate(http_requests_total[5m])) by (job)
          ) > 0.20
        for: 10m
        labels:
          severity: warning
          category: errors
        annotations:
          summary: "High client error rate on {{ `{{` }} $labels.job {{ `}}` }}"
          description: "Service {{ `{{` }} $labels.job {{ `}}` }} has 4xx error rate above 20% (current: {{ `{{` }} $value | humanizePercentage {{ `}}` }})"

    - name: service_performance
      interval: 30s
      rules:
      # High Latency Alerts
      - alert: HighResponseTime
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (job, le)
          ) > 2
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High response time on {{ `{{` }} $labels.job {{ `}}` }}"
          description: "Service {{ `{{` }} $labels.job {{ `}}` }} 95th percentile response time is above 2 seconds (current: {{ `{{` }} $value {{ `}}` }}s)"

      - alert: CriticalResponseTime
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (job, le)
          ) > 5
        for: 2m
        labels:
          severity: critical
          category: performance
        annotations:
          summary: "Critical response time on {{ `{{` }} $labels.job {{ `}}` }}"
          description: "Service {{ `{{` }} $labels.job {{ `}}` }} 95th percentile response time is above 5 seconds (current: {{ `{{` }} $value {{ `}}` }}s)"

      - alert: HighRequestRate
        expr: sum(rate(http_requests_total[5m])) by (job) > 1000
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High request rate on {{ `{{` }} $labels.job {{ `}}` }}"
          description: "Service {{ `{{` }} $labels.job {{ `}}` }} is receiving high traffic (current: {{ `{{` }} $value {{ `}}` }} req/s)"

    - name: resource_exhaustion
      interval: 30s
      rules:
      # Resource Alerts
      - alert: HighCPUUsage
        expr: |
          sum(rate(container_cpu_usage_seconds_total{namespace="hotel-reservation",container!=""}[5m])) by (pod)
          /
          sum(container_spec_cpu_quota{namespace="hotel-reservation",container!=""}/container_spec_cpu_period{namespace="hotel-reservation",container!=""}) by (pod)
          > 0.80
        for: 5m
        labels:
          severity: warning
          category: resources
        annotations:
          summary: "High CPU usage on {{ `{{` }} $labels.pod {{ `}}` }}"
          description: "Pod {{ `{{` }} $labels.pod {{ `}}` }} CPU usage is above 80% (current: {{ `{{` }} $value | humanizePercentage {{ `}}` }})"

      - alert: HighMemoryUsage
        expr: |
          sum(container_memory_working_set_bytes{namespace="hotel-reservation",container!=""}) by (pod)
          /
          sum(container_spec_memory_limit_bytes{namespace="hotel-reservation",container!=""}) by (pod)
          > 0.80
        for: 5m
        labels:
          severity: warning
          category: resources
        annotations:
          summary: "High memory usage on {{ `{{` }} $labels.pod {{ `}}` }}"
          description: "Pod {{ `{{` }} $labels.pod {{ `}}` }} memory usage is above 80% (current: {{ `{{` }} $value | humanizePercentage {{ `}}` }})"

      - alert: PodRestartingFrequently
        expr: rate(kube_pod_container_status_restarts_total{namespace="hotel-reservation"}[15m]) > 0.1
        for: 5m
        labels:
          severity: warning
          category: stability
        annotations:
          summary: "Pod {{ `{{` }} $labels.pod {{ `}}` }} is restarting frequently"
          description: "Pod {{ `{{` }} $labels.pod {{ `}}` }} has restarted {{ `{{` }} $value {{ `}}` }} times in the last 15 minutes"

      - alert: PodCrashLooping
        expr: rate(kube_pod_container_status_restarts_total{namespace="hotel-reservation"}[30m]) > 0.5
        for: 5m
        labels:
          severity: critical
          category: stability
        annotations:
          summary: "Pod {{ `{{` }} $labels.pod {{ `}}` }} is crash looping"
          description: "Pod {{ `{{` }} $labels.pod {{ `}}` }} is in crash loop ({{ `{{` }} $value {{ `}}` }} restarts in 30 minutes)"

    - name: infrastructure_health
      interval: 30s
      rules:
      # Database Alerts
      - alert: PostgresDown
        expr: up{job=~"postgres-.*"} == 0
        for: 1m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "PostgreSQL database {{ `{{` }} $labels.job {{ `}}` }} is down"
          description: "PostgreSQL instance {{ `{{` }} $labels.job {{ `}}` }} is unreachable"

      - alert: HighDatabaseConnections
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "High database connections on {{ `{{` }} $labels.datname {{ `}}` }}"
          description: "Database {{ `{{` }} $labels.datname {{ `}}` }} has {{ `{{` }} $value {{ `}}` }} active connections"

      - alert: MongoDBDown
        expr: up{job="mongodb"} == 0
        for: 1m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "MongoDB is down"
          description: "MongoDB instance is unreachable"

      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: high
          category: infrastructure
        annotations:
          summary: "Redis is down"
          description: "Redis instance is unreachable. Caching is unavailable."

      - alert: KafkaDown
        expr: up{job="kafka"} == 0
        for: 1m
        labels:
          severity: high
          category: infrastructure
        annotations:
          summary: "Kafka is down"
          description: "Kafka broker is unreachable. Event streaming is unavailable."
{{- end }}

