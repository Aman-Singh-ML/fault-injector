              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "pluginVersion": "8.0.0",
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{job=\"$service\",status=~\"4..\"}[5m])) by (endpoint) / sum(rate(http_requests_total{job=\"$service\"}[5m])) by (endpoint)",
              "interval": "",
              "legendFormat": "{{`{{endpoint}}`}} - 4xx",
              "refId": "A"
            },
            {
              "expr": "sum(rate(http_requests_total{job=\"$service\",status=~\"5..\"}[5m])) by (endpoint) / sum(rate(http_requests_total{job=\"$service\"}[5m])) by (endpoint)",
