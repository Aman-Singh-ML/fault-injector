{{- if .Values.observability.grafana.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-individual-services
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hotel-reservation.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
