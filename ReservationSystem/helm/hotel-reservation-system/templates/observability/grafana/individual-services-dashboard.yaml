          "targets": [
            {
              "expr": "sum(rate(http_requests_total{job=\"$service\"}[5m])) by (method)",
              "interval": "",
              "legendFormat": "{{`{{method}}`}}",
              "refId": "A"
            }
          ],
          "title": "$service - Request Rate by Method",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 27,
      "style": "dark",
