            {
              "expr": "sum(rate(http_requests_total{job=\"$service\"}[5m])) by (status)",
              "interval": "",
              "legendFormat": "{{`{{status}}`}}",
              "refId": "A"
            }
          ],
          "title": "$service - Response Status Codes",
          "type": "timeseries"
