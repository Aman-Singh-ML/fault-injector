{{- if .Values.observability.grafana.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hotel-reservation.labels" . | nindent 4 }}
    app.kubernetes.io/name: grafana-dashboards
data:
  microservices-overview.json: |
    {
      "dashboard": {
        "id": null,
        "title": "Hotel Reservation System - Microservices Overview",
        "tags": ["hotel-reservation", "microservices"],
        "style": "dark",
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "Service Health Status",
            "type": "stat",
            "targets": [
              {
                "expr": "up{job=~\".*hotel-reservation.*\"}",
                "legendFormat": "{{`{{job}}`}}"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "thresholds"
                },
                "thresholds": {
                  "steps": [
                    {"color": "red", "value": 0},
                    {"color": "green", "value": 1}
                  ]
                }
              }
            },
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "Request Rate (RPS)",
            "type": "graph",
            "targets": [
              {
                "expr": "sum(rate(http_requests_total[5m])) by (service)",
                "legendFormat": "{{`{{service}}`}}"
              }
            ],
            "yAxes": [
              {"label": "Requests/sec", "min": 0}
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
          },
          {
            "id": 3,
            "title": "Response Time (95th percentile)",
            "type": "graph",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service))",
                "legendFormat": "{{`{{service}}`}}"
              }
            ],
            "yAxes": [
              {"label": "Seconds", "min": 0}
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}
          },
          {
            "id": 4,
            "title": "Error Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "sum(rate(http_requests_total{status_code=~\"5..\"}[5m])) by (service) / sum(rate(http_requests_total[5m])) by (service)",
                "legendFormat": "{{`{{service}}`}}"
              }
            ],
            "yAxes": [
              {"label": "Error Rate", "min": 0, "max": 1}
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}
          }
        ],
        "time": {
          "from": "now-1h",
          "to": "now"
        },
        "refresh": "30s"
      }
    }
  
  business-metrics.json: |
    {
      "dashboard": {
        "id": null,
        "title": "Hotel Reservation System - Business Metrics",
        "tags": ["hotel-reservation", "business"],
        "style": "dark",
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "User Registrations",
            "type": "stat",
            "targets": [
              {
                "expr": "increase(gateway_user_registrations_total[1h])",
                "legendFormat": "Registrations/hour"
              }
            ],
            "gridPos": {"h": 8, "w": 6, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "User Logins",
            "type": "stat",
            "targets": [
              {
                "expr": "increase(gateway_user_logins_total{status=\"success\"}[1h])",
                "legendFormat": "Successful Logins/hour"
              }
            ],
            "gridPos": {"h": 8, "w": 6, "x": 6, "y": 0}
          },
          {
            "id": 3,
            "title": "Hotel Searches",
            "type": "stat",
            "targets": [
              {
                "expr": "increase(gateway_hotel_searches_total[1h])",
                "legendFormat": "Searches/hour"
              }
            ],
            "gridPos": {"h": 8, "w": 6, "x": 12, "y": 0}
          },
          {
            "id": 4,
            "title": "Bookings",
            "type": "stat",
            "targets": [
              {
                "expr": "increase(gateway_booking_attempts_total{status=\"success\"}[1h])",
                "legendFormat": "Bookings/hour"
              }
            ],
            "gridPos": {"h": 8, "w": 6, "x": 18, "y": 0}
          },
          {
            "id": 5,
            "title": "Booking Success Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(gateway_booking_attempts_total{status=\"success\"}[5m]) / rate(gateway_booking_attempts_total[5m])",
                "legendFormat": "Success Rate"
              }
            ],
            "yAxes": [
              {"label": "Rate", "min": 0, "max": 1}
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}
          },
          {
            "id": 6,
            "title": "Payment Success Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(gateway_payment_attempts_total{status=\"success\"}[5m]) / rate(gateway_payment_attempts_total[5m])",
                "legendFormat": "Success Rate"
              }
            ],
            "yAxes": [
              {"label": "Rate", "min": 0, "max": 1}
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}
          }
        ],
        "time": {
          "from": "now-6h",
          "to": "now"
        },
        "refresh": "1m"
      }
    }

  infrastructure.json: |
    {
      "dashboard": {
        "id": null,
        "title": "Hotel Reservation System - Infrastructure",
        "tags": ["hotel-reservation", "infrastructure"],
        "style": "dark",
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "Database Connections",
            "type": "graph",
            "targets": [
              {
                "expr": "pg_stat_activity_count",
                "legendFormat": "{{`{{datname}}`}}"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "Redis Memory Usage",
            "type": "graph",
            "targets": [
              {
                "expr": "redis_memory_used_bytes",
                "legendFormat": "Memory Used"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
          },
          {
            "id": 3,
            "title": "MongoDB Operations",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(mongodb_op_counters_total[5m])",
                "legendFormat": "{{`{{type}}`}}"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}
          },
          {
            "id": 4,
            "title": "Kafka Consumer Lag",
            "type": "graph",
            "targets": [
              {
                "expr": "kafka_consumer_lag_sum",
                "legendFormat": "{{`{{topic}}`}}"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}
          }
        ],
        "time": {
          "from": "now-1h",
          "to": "now"
        },
        "refresh": "30s"
      }
    }
{{- end }}
