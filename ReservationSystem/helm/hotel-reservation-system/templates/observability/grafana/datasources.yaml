{{- if .Values.observability.grafana.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hotel-reservation.labels" . | nindent 4 }}
    app.kubernetes.io/name: grafana-datasources
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    {{- if .Values.observability.prometheus.enabled }}
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus:9090
      isDefault: true
      editable: true
      jsonData:
        timeInterval: "5s"
        queryTimeout: "300s"
        httpMethod: "POST"
    {{- end }}
    {{- if .Values.observability.loki.enabled }}
    - name: Loki
      type: loki
      access: proxy
      url: http://loki:3100
      uid: loki
      editable: true
      jsonData:
        maxLines: 1000
        derivedFields:
          - datasourceUid: jaeger
            matcherRegex: "traceID=(\\w+)"
            name: TraceID
            url: "$${__value.raw}"
    {{- end }}
    {{- if .Values.observability.jaeger.enabled }}
    - name: Jaeger
      type: jaeger
      access: proxy
      url: http://jaeger-query:16686
      uid: jaeger
      editable: true
      jsonData:
        tracesToLogs:
          datasourceUid: loki
          tags: ['job', 'instance', 'pod', 'namespace']
          mappedTags: [
            { key: 'service.name', value: 'service' }
          ]
          mapTagNamesEnabled: false
          spanStartTimeShift: '1h'
          spanEndTimeShift: '1h'
          filterByTraceID: false
          filterBySpanID: false
        nodeGraph:
          enabled: true
    {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hotel-reservation.labels" . | nindent 4 }}
    app.kubernetes.io/name: grafana-dashboards-config
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
    - name: 'hotel-reservation-dashboards'
      orgId: 1
      folder: 'Hotel Reservation System'
      type: file
      disableDeletion: false
      updateIntervalSeconds: 10
      allowUiUpdates: true
      options:
        path: /var/lib/grafana/dashboards
{{- end }}
