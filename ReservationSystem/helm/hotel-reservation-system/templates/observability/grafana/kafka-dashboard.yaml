{{- if .Values.observability.grafana.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-kafka
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hotel-reservation.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  kafka-dashboard.json: |-
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 10,
                "gradientMode": "none",
                "hideFrom": {
                  "tooltip": false,
                  "viz": false,
                  "legend": false
                },
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "spanNulls": true
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "msg/s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "id": 2,
          "options": {
            "legend": {
              "calcs": ["mean", "max"],
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "pluginVersion": "8.0.0",
          "targets": [
            {
              "expr": "sum(rate(booking_service_kafka_messages_total{status=\"sent\"}[5m])) or vector(0)",
              "interval": "",
              "legendFormat": "Booking Service - Sent",
              "refId": "A"
            },
            {
              "expr": "sum(rate(booking_service_kafka_messages_total{status=\"failed\"}[5m])) or vector(0)",
              "interval": "",
              "legendFormat": "Booking Service - Failed",
              "refId": "B"
            },
            {
              "expr": "sum(rate(notification_service_kafka_messages_total{status=\"received\"}[5m])) or vector(0)",
              "interval": "",
              "legendFormat": "Notification Service - Received",
              "refId": "C"
            },
            {
              "expr": "sum(rate(notification_service_kafka_messages_total{status=\"failed\"}[5m])) or vector(0)",
              "interval": "",
              "legendFormat": "Notification Service - Failed",
              "refId": "D"
            }
          ],
          "title": "Kafka Message Rate (Application Level)",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 10,
                "gradientMode": "none",
                "hideFrom": {
                  "tooltip": false,
                  "viz": false,
                  "legend": false
                },
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "spanNulls": true
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "msg"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "id": 4,
          "options": {
            "legend": {
              "calcs": ["sum"],
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "pluginVersion": "8.0.0",
          "targets": [
            {
              "expr": "sum(booking_service_kafka_messages_total{status=\"sent\"}) or vector(0)",
              "interval": "",
              "legendFormat": "Booking Service - Total Sent",
              "refId": "A"
            },
            {
              "expr": "sum(notification_service_kafka_messages_total{status=\"received\"}) or vector(0)",
              "interval": "",
              "legendFormat": "Notification Service - Total Received",
              "refId": "B"
            }
          ],
          "title": "Total Kafka Messages",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 10,
                "gradientMode": "none",
                "hideFrom": {
                  "tooltip": false,
                  "viz": false,
                  "legend": false
                },
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "spanNulls": true
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "id": 6,
          "options": {
            "legend": {
              "calcs": ["mean", "p95"],
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "pluginVersion": "8.0.0",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(booking_service_kafka_message_duration_seconds_bucket[5m])) by (topic, le)) or vector(0)",
              "interval": "",
              "legendFormat": "Booking Service - {{`{{topic}}`}} - p95",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(booking_service_kafka_message_duration_seconds_bucket[5m])) by (topic, le)) or vector(0)",
              "interval": "",
              "legendFormat": "Booking Service - {{`{{topic}}`}} - p99",
              "refId": "B"
            }
          ],
          "title": "Kafka Message Processing Duration",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 10,
                "gradientMode": "none",
                "hideFrom": {
                  "tooltip": false,
                  "viz": false,
                  "legend": false
                },
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "spanNulls": true
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "msg/s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "id": 8,
          "options": {
            "legend": {
              "calcs": ["mean", "max"],
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "pluginVersion": "8.0.0",
          "targets": [
            {
              "expr": "sum(rate(booking_service_kafka_messages_total{topic=\"booking-events\"}[5m])) by (status) or vector(0)",
              "interval": "",
              "legendFormat": "booking-events - {{`{{status}}`}}",
              "refId": "A"
            },
            {
              "expr": "sum(rate(notification_service_kafka_messages_total{topic=\"booking-events\"}[5m])) by (status) or vector(0)",
              "interval": "",
              "legendFormat": "booking-events (notifications) - {{`{{status}}`}}",
              "refId": "B"
            }
          ],
          "title": "Messages by Topic",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 27,
      "style": "dark",
      "tags": ["kafka", "messaging", "infrastructure"],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "title": "Kafka Monitoring (Application Level)",
      "uid": "kafka-dashboard",
      "version": 1
    }
{{- end }}

