              "legendFormat": "{{`{{pod}}`}}",
              "refId": "A"
            }
          ],
          "title": "Pod Readiness Over Time",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "CrashLoopBackOff": {
                      "color": "red",
                      "index": 0
                    },
                    "Error": {
                      "color": "red",
                      "index": 1
                    },
                    "OOMKilled": {
                      "color": "dark-red",
                      "index": 2
                    },
                    "Completed": {
                      "color": "green",
                      "index": 3
                    },
                    "ContainerCannotRun": {
                      "color": "orange",
                      "index": 4
                    }
                  },
                  "type": "value"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
