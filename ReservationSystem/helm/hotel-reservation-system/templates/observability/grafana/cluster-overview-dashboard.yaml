{{- if .Values.observability.grafana.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cluster-overview
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hotel-reservation.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  cluster-overview-dashboard.json: |-
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 0,
            "y": 0
          },
          "id": 2,
          "options": {
            "orientation": "auto",
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true,
            "text": {
              "titleSize": 16,
              "valueSize": 32
            }
          },
          "pluginVersion": "8.0.0",
          "targets": [
            {
              "expr": "count(up{namespace=\"hotel-reservation\"})",
              "interval": "",
              "legendFormat": "Total Services",
              "refId": "A"
            }
          ],
          "title": "Total Services",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 8,
            "y": 0
          },
          "id": 4,
          "options": {
            "orientation": "auto",
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true,
            "text": {
              "titleSize": 16,
              "valueSize": 32
            }
          },
          "pluginVersion": "8.0.0",
          "targets": [
            {
              "expr": "count(up{namespace=\"hotel-reservation\"} == 1)",
              "interval": "",
              "legendFormat": "Healthy Services",
              "refId": "A"
            }
          ],
          "title": "Healthy Services",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 16,
            "y": 0
          },
          "id": 6,
          "options": {
            "orientation": "auto",
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true,
            "text": {
              "titleSize": 16,
              "valueSize": 32
            }
          },
          "pluginVersion": "8.0.0",
          "targets": [
            {
              "expr": "count(up{namespace=\"hotel-reservation\"} == 0)",
              "interval": "",
              "legendFormat": "Down Services",
              "refId": "A"
            }
          ],
          "title": "Down Services",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 10,
                "gradientMode": "none",
                "hideFrom": {
                  "tooltip": false,
                  "viz": false,
                  "legend": false
                },
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "spanNulls": true
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "id": 8,
          "options": {
            "legend": {
              "calcs": ["mean", "max"],
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "pluginVersion": "8.0.0",
          "targets": [
            {
              "expr": "sum(rate(gateway_http_requests_total[5m]))",
              "interval": "",
              "legendFormat": "Gateway",
              "refId": "A"
            },
            {
              "expr": "sum(rate(http_requests_total{job=\"booking-service\"}[5m]))",
              "interval": "",
              "legendFormat": "Booking Service",
              "refId": "B"
            },
            {
              "expr": "sum(rate(http_requests_total{job=\"search-service\"}[5m]))",
              "interval": "",
              "legendFormat": "Search Service",
              "refId": "C"
            },
            {
              "expr": "sum(rate(http_requests_total{job=\"payment-service\"}[5m]))",
              "interval": "",
              "legendFormat": "Payment Service",
              "refId": "D"
            },
            {
              "expr": "sum(rate(http_requests_total{job=\"notification-service\"}[5m]))",
              "interval": "",
              "legendFormat": "Notification Service",
              "refId": "E"
            }
          ],
          "title": "Request Rate by Service",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 10,
                "gradientMode": "none",
                "hideFrom": {
                  "tooltip": false,
                  "viz": false,
                  "legend": false
                },
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "spanNulls": true
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "id": 10,
          "options": {
            "legend": {
              "calcs": ["mean", "max"],
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "pluginVersion": "8.0.0",
          "targets": [
            {
              "expr": "sum(rate(gateway_http_requests_total{status_code=~\"5..\"}[5m])) / sum(rate(gateway_http_requests_total[5m]))",
              "interval": "",
              "legendFormat": "Gateway Error Rate",
              "refId": "A"
            },
            {
              "expr": "sum(rate(http_requests_total{job=\"booking-service\",status=~\"5..\"}[5m])) / sum(rate(http_requests_total{job=\"booking-service\"}[5m]))",
              "interval": "",
              "legendFormat": "Booking Service Error Rate",
              "refId": "B"
            },
            {
              "expr": "sum(rate(http_requests_total{job=\"search-service\",status=~\"5..\"}[5m])) / sum(rate(http_requests_total{job=\"search-service\"}[5m]))",
              "interval": "",
              "legendFormat": "Search Service Error Rate",
              "refId": "C"
            }
          ],
          "title": "Error Rate by Service",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 27,
      "style": "dark",
      "tags": ["kubernetes", "cluster", "overview"],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "title": "Cluster Overview Dashboard",
      "uid": "cluster-overview-dashboard",
      "version": 1
    }
{{- end }}

