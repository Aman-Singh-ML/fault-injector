{{- if .Values.observability.grafana.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hotel-reservation.labels" . | nindent 4 }}
    app.kubernetes.io/name: grafana
data:
  grafana.ini: |
    [analytics]
    check_for_updates = true
    [grafana_net]
    url = https://grafana.net
    [log]
    mode = console
    [paths]
    data = /var/lib/grafana/
    logs = /var/log/grafana
    plugins = /var/lib/grafana/plugins
    provisioning = /etc/grafana/provisioning
    [server]
    root_url = /
    serve_from_sub_path = false
    [security]
    admin_user = {{ .Values.observability.grafana.adminUser | default "admin" }}
    admin_password = {{ .Values.observability.grafana.adminPassword | default "admin123" }}
    [users]
    allow_sign_up = false
    [auth.anonymous]
    enabled = false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hotel-reservation.labels" . | nindent 4 }}
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      serviceAccountName: grafana
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      {{- if .Values.observability.grafana.persistence }}
      initContainers:
      - name: init-grafana
        image: busybox:1.35
        command: ['sh', '-c', 'mkdir -p /var/lib/grafana && chown -R 472:472 /var/lib/grafana']
        volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana
        securityContext:
          runAsUser: 0
      {{- end }}
      containers:
      - name: grafana
        image: grafana/grafana:10.2.0
        ports:
        - containerPort: 3000
          name: http-grafana
        volumeMounts:
        - name: grafana-config
          mountPath: /etc/grafana
        - name: grafana-datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: grafana-dashboards-config
          mountPath: /etc/grafana/provisioning/dashboards
        - name: grafana-dashboards
          mountPath: /var/lib/grafana/dashboards
        {{- if .Values.observability.grafana.persistence }}
        - name: grafana-storage
          mountPath: /var/lib/grafana
        {{- end }}
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: {{ .Values.observability.grafana.adminUser | default "admin" }}
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: {{ .Values.observability.grafana.adminPassword | default "admin123" }}
        - name: GF_INSTALL_PLUGINS
          value: "grafana-piechart-panel,grafana-worldmap-panel,grafana-clock-panel"
        - name: GF_SERVER_SERVE_FROM_SUB_PATH
          value: "false"
        - name: GF_SERVER_ROOT_URL
          value: "/"
        - name: GF_SERVER_ENFORCE_DOMAIN
          value: "false"
        - name: GF_SERVER_ENABLE_GZIP
          value: "true"
        - name: GF_SECURITY_ALLOW_EMBEDDING
          value: "true"
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        livenessProbe:
          failureThreshold: 3
          initialDelaySeconds: 60
          periodSeconds: 30
          successThreshold: 1
          tcpSocket:
            port: 3000
          timeoutSeconds: 5
      volumes:
      - name: grafana-config
        configMap:
          name: grafana-config
      - name: grafana-datasources
        configMap:
          name: grafana-datasources
      - name: grafana-dashboards-config
        configMap:
          name: grafana-dashboards-config
      - name: grafana-dashboards
        configMap:
          name: grafana-dashboards
      {{- if .Values.observability.grafana.persistence }}
      - name: grafana-storage
        persistentVolumeClaim:
          claimName: grafana-pvc
      {{- end }}
---
{{- if .Values.observability.grafana.persistence }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hotel-reservation.labels" . | nindent 4 }}
    app.kubernetes.io/name: grafana
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: {{ .Values.global.storageClass | default "default" }}
  resources:
    requests:
      storage: {{ .Values.observability.grafana.storage | default "10Gi" }}
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: {{ .Values.global.namespace }}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hotel-reservation.labels" . | nindent 4 }}
    app.kubernetes.io/name: grafana
spec:
  type: {{ .Values.observability.grafana.service.type | default "ClusterIP" }}
  ports:
  - name: http-grafana
    port: 3000
    targetPort: 3000
    {{- if eq (.Values.observability.grafana.service.type | default "ClusterIP") "NodePort" }}
    nodePort: {{ .Values.observability.grafana.service.nodePort | default 30300 }}
    {{- end }}
  selector:
    app.kubernetes.io/name: grafana
{{- end }}
