# Hotel Reservation System - Nginx Configuration Values
# This file contains optimized values for deployment with integrated nginx

# Global configuration
global:
  namespace: hotel-reservation
  environment: development
  imageRegistry: ""
  imagePullPolicy: Always
  imagePullSecrets: []

# Enable nginx reverse proxy
nginx:
  enabled: true
  name: nginx
  replicaCount: 1

  image:
    repository: nginx
    tag: "1.25-alpine"
    pullPolicy: IfNotPresent

  service:
    type: LoadBalancer
    port: 80
    targetPort: 80
    annotations:
      # For cloud providers, you can add specific annotations
      # service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      # service.beta.kubernetes.io/azure-load-balancer-scheme: "Internet"

  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

  config:
    workerProcesses: "auto"
    workerConnections: 1024
    keepaliveTimeout: 65
    clientMaxBodySize: "10m"
    clientBodyTimeout: "60s"
    clientHeaderTimeout: "60s"
    proxyConnectTimeout: "60s"
    proxyReadTimeout: "60s"
    proxySendTimeout: "60s"
    proxyBufferSize: "4k"
    proxyBuffers: "8 4k"
    rateLimitZone: "$binary_remote_addr zone=api:10m rate=10r/s"
    rateLimitBurst: 20
    
    securityHeaders:
      enabled: true
      frameOptions: "DENY"
      contentTypeOptions: "nosniff"
      xssProtection: "1; mode=block"
      referrerPolicy: "strict-origin-when-cross-origin"
      contentSecurityPolicy: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' ws: wss:;"
    
    gzip:
      enabled: true
      level: 6
      minLength: 1000
      types: "text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/x-javascript text/js"

# Frontend configuration (ClusterIP when using nginx)
frontend:
  enabled: true
  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000

# Gateway configuration (ClusterIP when using nginx)
gateway:
  enabled: true
  service:
    type: ClusterIP
    port: 9000
    targetPort: 9000

# Enhanced ingress configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS, PATCH"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-User-Id,X-User-Role"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
  hosts:
    - host: hotel-reservation.local
      paths:
        - path: /api
          pathType: Prefix
          service: nginx
          port: 80
        - path: /
          pathType: Prefix
          service: nginx
          port: 80
  tls: []

# Service configurations - all set to ClusterIP for internal communication
authService:
  enabled: true
  service:
    type: ClusterIP

searchService:
  enabled: true
  service:
    type: ClusterIP

bookingService:
  enabled: true
  service:
    type: ClusterIP

paymentService:
  enabled: true
  service:
    type: ClusterIP

notificationService:
  enabled: true
  service:
    type: ClusterIP

# Infrastructure services remain the same
postgresAuth:
  enabled: true

postgresBooking:
  enabled: true

postgresPayment:
  enabled: true

mongodb:
  enabled: true

redis:
  enabled: true

kafka:
  enabled: true

zookeeper:
  enabled: true

rabbitmq:
  enabled: true

# Network policies for enhanced security
networkPolicy:
  enabled: true

# Monitoring and observability
serviceMonitor:
  enabled: false

# Horizontal Pod Autoscaler
hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
